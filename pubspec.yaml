name: overtime_tally
description: "OvertimeTally - 记录每日上下班时间，按公司弹性工时与加班调休规则计算加班时长、加班费与调休。"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.1+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # 中文日期/时间选择器与本地化支持
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  # 状态管理
  provider: ^6.1.2

  # 本地持久化
  sqflite: ^2.4.2
  path: ^1.9.1

  # 日期与星期格式化
  intl: ^0.20.2

  # 生成 .xlsx
  excel: ^4.0.6

  # 调用系统原生保存弹窗
  file_picker: ^8.1.2

  # 导出文件命名计数的持久化目录
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0

  # 生成各平台应用图标
  flutter_launcher_icons: ^0.13.1

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application.
  uses-material-design: true

# 应用图标配置：运行 `dart run flutter_launcher_icons` 生成。
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/OvertimeTallyLogo.png"
  adaptive_icon_background: "#FCFCFA"
  adaptive_icon_foreground: "assets/OvertimeTallyLogoForeground.png"
  web:
    generate: true
    image_path: "assets/OvertimeTallyLogo.png"
    background_color: "#FCFCFA"
    theme_color: "#FCFCFA"
  windows:
    generate: true
    image_path: "assets/OvertimeTallyLogo.png"
    icon_size: 256

